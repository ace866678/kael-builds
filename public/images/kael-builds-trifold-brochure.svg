<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Kael Builds tri-fold brochure concept</title>
  <desc id="desc">A three-panel print design study using charcoal, warm white, and lime. The panels introduce the studio, summarize web, research, and prototype work, and point to the portfolio website.</desc>
  <rect width="1200" height="900" fill="#F6F7F4"/>

      <text x="48" y="382" font-size="68" font-weight="800" letter-spacing="-3">INTENT<tspan fill="#D5F36A">.</tspan></text>
      <text x="48" y="472" font-size="23" fill="#DCE4DE">Digital work for</text>
      <text x="48" y="504" font-size="23" fill="#DCE4DE">specific problems.</text>
      <path d="M48 582H352" stroke="#F6F7F4" stroke-opacity=".22"/>
      <text x="48" y="616" font-size="12" letter-spacing="1.5" fill="#A8B4AD">PLAN WITH PURPOSE.</text>
      <text x="48" y="640" font-size="12" letter-spacing="1.5" fill="#A8B4AD">MAKE IT USEFUL.</text>
      <text x="48" y="664" font-size="12" letter-spacing="1.5" fill="#A8B4AD">REFINE WHAT MATTERS.</text>
      <circle cx="319" cy="744" r="29" fill="none" stroke="#D5F36A" stroke-width="1.5"/>
      <path d="M300 744H338M319 725V763" stroke="#D5F36A" stroke-width="1.5"/>
      <text x="48" y="842" font-size="10" letter-spacing="1.8" fill="#A8B4AD">STUDIO SERVICES / CONCEPT</text>
